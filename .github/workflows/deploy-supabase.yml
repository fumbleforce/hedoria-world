# Deploys the Limelight (streamer-sim) Supabase backend from CI — no local
# machine required. Runs the same commands you'd run locally with the CLI:
# pushes migrations and deploys the edge functions.
#
# Trigger: manually from the Actions tab ("Run workflow"), or automatically
# when anything under streamer-sim/supabase/ changes on main.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — Supabase account token (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password
#
# Edge-function runtime secrets (OPENROUTER_API_KEY, etc.) are NOT set here.
# Set them once in the Supabase dashboard (Edge Functions → Secrets) or add the
# optional "Set function secrets" step below.

name: Deploy Supabase (Limelight)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "streamer-sim/supabase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamer-sim
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: jljvshjstlpwmobhkxeu
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: |
          supabase functions deploy openrouter-proxy
          supabase functions deploy lemon-webhook

      # Optional: uncomment to manage edge-function secrets from CI instead of
      # the dashboard. Add the matching GitHub repo secrets first.
      # - name: Set function secrets
      #   run: |
      #     supabase secrets set \
      #       OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
      #       OPENROUTER_APP_TITLE="Limelight" \
      #       APP_URL="${{ secrets.APP_URL }}"
